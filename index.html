<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Claims 🎀 Y2K Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,wght@9..144,100,700;9..144,100,900&family=Gamja+Flower&family=Silkscreen&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-pink: #ffd6e0;
            --bg-pink-light: #ffeef2;
            --pink-dark: #d66885;
            --pink-border: #f4a4b8;
            --text-brown: #6e4752;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Gamja Flower', cursive;
            background-color: var(--bg-pink-light);
            background-image: 
                linear-gradient(90deg, rgba(255, 182, 193, 0.25) 1px, transparent 1px),
                linear-gradient(rgba(255, 182, 193, 0.25) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 16px 50px;
            position: relative;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 999;
        }

        .lace-top {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 16px;
            background: radial-gradient(circle at 10px 0, transparent 8px, #ffffff 9px);
            background-size: 20px 16px;
            z-index: 100;
            filter: drop-shadow(0 2px 3px rgba(214, 104, 133, 0.2));
        }

        .container {
            width: 100%;
            max-width: 520px;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
            animation: floaty 3.5s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Foto do Stray Kids redondinha com bordinha fofa */
        .avatar-circle {
            width: 104px;
            height: 104px;
            border: 4px solid var(--white);
            border-radius: 50%;
            margin: 0 auto 10px;
            overflow: hidden;
            box-shadow: 0 6px 0 var(--pink-border), 0 10px 20px rgba(214, 104, 133, 0.25);
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-badge {
            font-family: 'Silkscreen', cursive;
            font-size: 10px;
            background: var(--white);
            color: var(--pink-dark);
            border: 2px solid var(--pink-border);
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        h1.retro-title {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 38px;
            color: var(--white);
            letter-spacing: 1px;
            text-shadow: 
                -2px -2px 0 var(--pink-dark),  
                 2px -2px 0 var(--pink-dark),
                -2px  2px 0 var(--pink-dark),
                 2px  2px 0 var(--pink-dark),
                 0px  4px 0 var(--pink-border);
            margin-bottom: 2px;
        }

        .skz-quote {
            font-size: 17px;
            color: var(--pink-dark);
            margin-bottom: 4px;
            font-style: italic;
        }

        .subtitle {
            font-size: 18px;
            color: var(--pink-dark);
            margin-bottom: 16px;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .win-input-group {
            display: flex;
            width: 100%;
            max-width: 340px;
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 0 var(--pink-border);
            transition: transform 0.15s;
        }

        .win-input-group:focus-within {
            transform: scale(1.02);
            border-color: var(--pink-dark);
        }

        .win-input-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 14px;
            font-family: 'Gamja Flower', cursive;
            font-size: 20px;
            color: var(--text-brown);
            background: transparent;
        }

        .win-input-group input::placeholder {
            color: #cfa3af;
        }

        .win-submit-btn {
            background: var(--pink-dark);
            color: var(--white);
            border: none;
            width: 48px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .win-submit-btn:hover {
            background: #bf5270;
        }

        .game-menu-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .pill-btn {
            font-family: 'Gamja Flower', cursive;
            font-size: 18px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe3ea 100%);
            color: var(--pink-dark);
            border: 2px solid var(--pink-border);
            border-radius: 50px;
            padding: 4px 18px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--pink-border);
            transition: all 0.15s;
        }

        .pill-btn:hover, .pill-btn.active {
            background: var(--pink-dark);
            color: var(--white);
            border-color: var(--pink-dark);
            transform: translateY(1px);
            box-shadow: 0 2px 0 #a8445f;
        }

        #status-message {
            text-align: center;
            font-size: 20px;
            background: var(--white);
            border: 2px dashed var(--pink-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            color: var(--pink-dark);
        }

        .claim-card {
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 5px 0 var(--pink-border);
            animation: popIn 0.35s ease-out backwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dotted var(--bg-pink);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .ceg-name {
            font-family: 'Fraunces', serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--pink-dark);
        }

        .type-tag {
            font-family: 'Silkscreen', cursive;
            font-size: 10px;
            background: var(--bg-pink);
            color: var(--pink-dark);
            padding: 3px 8px;
            border-radius: 8px;
        }

        .card-info {
            font-size: 20px;
            line-height: 1.35;
        }

        .card-info p {
            margin-bottom: 4px;
        }

        .members-box {
            display: inline-block;
            background: var(--bg-pink-light);
            border: 1.5px solid var(--pink-border);
            border-radius: 12px;
            padding: 2px 10px;
            margin: 4px 0;
            font-size: 22px;
        }

        .status-geral-tag {
            display: inline-block;
            background: #fce4ec;
            color: #c2185b;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
        }

        .card-bottom {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dotted var(--bg-pink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 19px;
        }

        .badge-pay {
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .paid {
            background: #e3f9e5;
            color: #2b7a3d;
            border: 1.5px solid #9be0a8;
        }

        .pending {
            background: #fff4d9;
            color: #9c6b00;
            border: 1.5px solid #ffd573;
        }

        .price-tag {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            color: var(--pink-dark);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="lace-top"></div>

    <div class="container">
        <header class="login-header">
            <div class="avatar-circle">
                <img src="https://i.pinimg.com/736x/8d/f3/d4/8df3d4094a91924613bb018041a012aa.jpg" alt="Stray Kids">
            </div>
            <div class="game-badge">★ PLAYER 1: CLAIM TRACKER ★</div>
            <h1 class="retro-title">My Claims</h1>
            <p class="skz-quote">all we need is love, and Stray Kids 🤍</p>
            <p class="subtitle">digite seu @ para buscar ♡</p>
        </header>

        <section class="login-box">
            <div class="win-input-group">
                <input type="text" id="searchInput" value="@tecuxazinha" placeholder="digite seu @..." onkeyup="if(event.key==='Enter') filtrarClaims()">
                <button class="win-submit-btn" onclick="filtrarClaims()" title="Buscar">→</button>
            </div>

            <div class="game-menu-pills">
                <button class="pill-btn active" onclick="setFiltro('todos', this)">✦ Todos</button>
                <button class="pill-btn" onclick="setFiltro('pago', this)">♡ Pagos</button>
                <button class="pill-btn" onclick="setFiltro('pendente', this)">⌛ A Pagar</button>
            </div>
        </section>

        <div id="status-message">carregando inventário de claims... 🎀</div>
        <main id="results-container"></main>
    </div>

    <script>
        const SHEET_ID = '1tQgHPwS4-JQyR-VHgE7IZbRUXdZQmZGwZWqrz-7jwx4';
        const SHEET_NAME = 'claims';
        let todasAsClaims = [];
        let filtroAtual = 'todos';

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && inQuotes && nextChar === '"') {
                    cell += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            if (cell !== '' || row.length > 0) {
                row.push(cell.trim());
                if (row.some(c => c !== '')) rows.push(row);
            }
            return rows;
        }

        async function iniciarSite() {
            const msg = document.getElementById('status-message');
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Falha na rede');
                const csvText = await response.text();
                const linhas = parseCSV(csvText);

                todasAsClaims = linhas.slice(1).map(col => ({
                    ceg: col[0] || '',
                    tipo: col[1] || '',
                    gom: col[2] || '',
                    itens: col[3] || '',
                    integrantes: col[4] || '',
                    valorTotal: col[5] || '',
                    statusPag: col[6] || '',
                    valorRestante: col[7] || '',
                    prazo1: col[8] || '',
                    prazo2: col[9] || '',
                    statusGeral: col[10] || '',
                    at: col[12] || ''
                })).filter(item => item.ceg !== '');

                renderizarClaims();
            } catch (erro) {
                console.error(erro);
                msg.innerText = 'ops! não consegui ler a planilha. confira se ela está pública como Leitor 🥺';
            }
        }

        function setFiltro(tipo, botao) {
            filtroAtual = tipo;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            botao.classList.add('active');
            renderizarClaims();
        }

        function filtrarClaims() {
            renderizarClaims();
        }

        function renderizarClaims() {
            const container = document.getElementById('results-container');
            const msg = document.getElementById('status-message');
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();

            container.innerHTML = '';

            const filtradas = todasAsClaims.filter(item => {
                const isPago = item.statusPag.toLowerCase().includes('pago');
                if (filtroAtual === 'pago' && !isPago) return false;
                if (filtroAtual === 'pendente' && isPago) return false;

                if (termo) {
                    const textoCompleto = `${item.ceg} ${item.gom} ${item.itens} ${item.integrantes} ${item.at}`.toLowerCase();
                    return textoCompleto.includes(termo);
                }
                return true;
            });

            if (filtradas.length === 0) {
                msg.style.display = 'block';
                msg.innerText = 'nenhuma claim encontrada para este @... (｡•́︿•̀｡)';
                return;
            }

            msg.style.display = 'none';

            filtradas.forEach((item, index) => {
                const isPago = item.statusPag.toLowerCase().includes('pago');
                const card = document.createElement('div');
                card.className = 'claim-card';
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="card-top-bar">
                        <span class="ceg-name">✦ ${item.ceg}</span>
                        ${item.tipo ? `<span class="type-tag">${item.tipo}</span>` : ''}
                    </div>
                    <div class="card-info">
                        <p><strong>gom/comu:</strong> ${item.gom}</p>
                        <p><strong>itens:</strong> ${item.itens}</p>
                        ${item.integrantes ? `<div class="members-box">${item.integrantes}</div>` : ''}
                        ${item.at ? `<p><strong>user:</strong> ${item.at}</p>` : ''}
                        <p><strong>prazos:</strong> 1º: ${item.prazo1 || '-'} | 2º: ${item.prazo2 || '-'}</p>
                        ${item.statusGeral ? `<p><strong>status ceg:</strong> <span class="status-geral-tag">${item.statusGeral}</span></p>` : ''}
                    </div>
                    <div class="card-bottom">
                        <span class="badge-pay ${isPago ? 'paid' : 'pending'}">
                            ${item.statusPag || 'Pendente'} ${item.valorRestante ? `(falta: ${item.valorRestante})` : ''}
                        </span>
                        <span class="price-tag">${item.valorTotal}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = iniciarSite;
    </script>
</body>
</html>
