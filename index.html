<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims 🎀 Collector : tecuxa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Fraunces:opsz,SOFT,wght@9..144,100,700;9..144,100,900&family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pink: #ffd6e0;
            --bg-pink-light: #ffeef2;
            --pink-dark: #d66885;
            --pink-border: #f4a4b8;
            --text-brown: #6e4752;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background-color: var(--bg-pink-light);
            background-image:
                linear-gradient(90deg, rgba(255, 182, 193, 0.25) 1px, transparent 1px),
                linear-gradient(rgba(255, 182, 193, 0.25) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 16px 55px;
            position: relative;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 999;
        }

        .lace-top {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 16px;
            background: radial-gradient(circle at 10px 0, transparent 8px, #ffffff 9px);
            background-size: 20px 16px;
            z-index: 100;
            filter: drop-shadow(0 2px 3px rgba(214, 104, 133, 0.2));
        }

        .container {
            width: 100%;
            max-width: 540px;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
            animation: floaty 3.5s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .avatar-circle {
            width: 96px;
            height: 96px;
            background-color: var(--pink-dark);
            border: 4px solid var(--white);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 var(--pink-border), 0 10px 20px rgba(214, 104, 133, 0.25);
        }

        .avatar-icon {
            width: 54px;
            height: 54px;
            fill: var(--white);
        }

        .game-badge {
            font-family: 'Silkscreen', cursive;
            font-size: 10px;
            background: var(--white);
            color: var(--pink-dark);
            border: 2px solid var(--pink-border);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        h1.retro-title {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 38px;
            color: var(--white);
            letter-spacing: 1px;
            text-shadow:
                -2px -2px 0 var(--pink-dark),
                 2px -2px 0 var(--pink-dark),
                -2px  2px 0 var(--pink-dark),
                 2px  2px 0 var(--pink-dark),
                 0px  4px 0 var(--pink-border);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--pink-dark);
            font-weight: 600;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .win-input-group {
            display: flex;
            width: 100%;
            max-width: 360px;
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 0 var(--pink-border);
            transition: transform 0.15s;
        }

        .win-input-group:focus-within {
            transform: scale(1.02);
            border-color: var(--pink-dark);
        }

        .win-input-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 14px;
            font-family: 'Comfortaa', cursive, sans-serif;
            font-size: 14px;
            color: var(--text-brown);
            background: transparent;
        }

        .win-input-group input::placeholder {
            color: #cfa3af;
        }

        .win-submit-btn {
            background: var(--pink-dark);
            color: var(--white);
            border: none;
            width: 48px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .win-submit-btn:hover {
            background: #bf5270;
        }

        .filters-panel {
            width: 100%;
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: 0 4px 0 var(--pink-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-menu-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .pill-btn {
            font-family: 'Comfortaa', cursive, sans-serif;
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(180deg, #ffffff 0%, #ffe3ea 100%);
            color: var(--pink-dark);
            border: 2px solid var(--pink-border);
            border-radius: 50px;
            padding: 6px 14px;
            cursor: pointer;
            box-shadow: 0 2px 0 var(--pink-border);
            transition: all 0.15s;
        }

        .pill-btn:hover, .pill-btn.active {
            background: var(--pink-dark);
            color: var(--white);
            border-color: var(--pink-dark);
            transform: translateY(1px);
            box-shadow: 0 2px 0 #a8445f;
        }

        .status-filter-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 2px dotted var(--bg-pink);
            font-size: 12px;
            font-weight: 700;
            color: var(--pink-dark);
        }

        .status-select {
            font-family: 'Comfortaa', cursive, sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-brown);
            background: var(--bg-pink-light);
            border: 2px solid var(--pink-border);
            border-radius: 12px;
            padding: 5px 10px;
            outline: none;
            cursor: pointer;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-card {
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 16px;
            padding: 10px 8px;
            text-align: center;
            box-shadow: 0 4px 0 var(--pink-border);
        }

        .summary-label {
            font-family: 'Silkscreen', cursive;
            font-size: 9px;
            color: var(--pink-dark);
            margin-bottom: 5px;
            display: block;
        }

        .summary-value {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 18px;
            color: var(--text-brown);
        }

        #status-message {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            background: var(--white);
            border: 2px dashed var(--pink-border);
            border-radius: 16px;
            padding: 18px 14px;
            margin-bottom: 16px;
            color: var(--pink-dark);
        }

        .retro-loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .retro-striped-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            position: relative;
            background: repeating-conic-gradient(
                from 0deg,
                var(--pink-dark) 0deg 22deg,
                var(--bg-pink) 22deg 45deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
            animation: spinStripes 0.95s steps(8) infinite;
        }

        @keyframes spinStripes {
            to { transform: rotate(360deg); }
        }

        .retro-loader-label {
            font-family: 'Silkscreen', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--pink-dark);
        }

        .claim-card {
            background: var(--white);
            border: 2.5px solid var(--pink-border);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 5px 0 var(--pink-border);
            animation: popIn 0.35s ease-out backwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dotted var(--bg-pink);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .ceg-name {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--pink-dark);
        }

        .type-tag {
            font-family: 'Silkscreen', cursive;
            font-size: 9px;
            background: var(--bg-pink);
            color: var(--pink-dark);
            padding: 4px 9px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .card-info {
            font-size: 13px;
            line-height: 1.5;
        }

        .card-info p {
            margin-bottom: 6px;
        }

        .members-box {
            display: inline-block;
            background: var(--bg-pink-light);
            border: 1.5px solid var(--pink-border);
            border-radius: 12px;
            padding: 5px 10px;
            margin: 4px 0 8px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .meta-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: 8px 0 10px;
        }

        .status-geral-tag {
            display: inline-block;
            background: #fce4ec;
            color: #c2185b;
            border: 1.5px solid #f4a4b8;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
        }

        .deadlines-box {
            background: var(--bg-pink-light);
            border: 1.5px solid var(--pink-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px;
        }

        .card-bottom {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dotted var(--bg-pink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .badge-pay {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .paid {
            background: #e3f9e5;
            color: #2b7a3d;
            border: 1.5px solid #9be0a8;
        }

        .pending {
            background: #fff4d9;
            color: #9c6b00;
            border: 1.5px solid #ffd573;
        }

        .price-tag {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            color: var(--pink-dark);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="lace-top"></div>

    <div class="container">
        <header class="login-header">
            <div class="avatar-circle">
                <svg class="avatar-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                </svg>
            </div>
            <div class="game-badge">★ COLLECTOR : TECUXA ★</div>
            <h1 class="retro-title">My Claims</h1>
            <p class="subtitle">digite seu @ para buscar ♡</p>
        </header>

        <section class="login-box">
            <div class="win-input-group">
                <input type="text" id="searchInput" value="@tecuxazinha" placeholder="digite seu @..." onkeyup="if(event.key==='Enter') filtrarClaims()">
                <button class="win-submit-btn" onclick="filtrarClaims()" title="Buscar">→</button>
            </div>

            <div class="filters-panel">
                <div class="game-menu-pills">
                    <button class="pill-btn active" onclick="setFiltro('todos', this)">✦ Todos</button>
                    <button class="pill-btn" onclick="setFiltro('pago', this)">♡ Pagos</button>
                    <button class="pill-btn" onclick="setFiltro('pendente', this)">⌛ A Pagar</button>
                </div>

                <div class="status-filter-row">
                    <span>📦 Status Geral:</span>
                    <select id="statusGeralSelect" class="status-select" onchange="filtrarClaims()">
                        <option value="todos">Todos os status</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="summary-grid" aria-label="Resumo das claims">
            <div class="summary-card">
                <span class="summary-label">TOTAL CEGS</span>
                <div class="summary-value" id="sum-total">0</div>
            </div>
            <div class="summary-card">
                <span class="summary-label">QUITADAS</span>
                <div class="summary-value" id="sum-paid">0</div>
            </div>
            <div class="summary-card">
                <span class="summary-label">A PAGAR</span>
                <div class="summary-value" id="sum-pending">R$ 0,00</div>
            </div>
        </section>

        <div id="status-message">
            <div class="retro-loader-box">
                <div class="retro-striped-spinner" aria-hidden="true"></div>
                <span class="retro-loader-label">LOADING...</span>
            </div>
        </div>
        <main id="results-container"></main>
    </div>

    <script>
        const SHEET_ID = '1tQgHPwS4-JQyR-VHgE7IZbRUXdZQmZGwZWqrz-7jwx4';
        const SHEET_NAME = 'claims';
        let todasAsClaims = [];
        let filtroAtual = 'todos';

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && inQuotes && nextChar === '"') {
                    cell += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            if (cell !== '' || row.length > 0) {
                row.push(cell.trim());
                if (row.some(c => c !== '')) rows.push(row);
            }
            return rows;
        }

        function parseCurrency(val) {
            if (!val) return 0;
            const cleaned = String(val)
                .replace(/[^\d,.-]/g, '')
                .replace(/\.(?=\d{3}(?:,|$))/g, '')
                .replace(',', '.');
            const num = parseFloat(cleaned);
            return Number.isNaN(num) ? 0 : num;
        }

        function formatBRL(num) {
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function popularStatusGeralSelect() {
            const select = document.getElementById('statusGeralSelect');
            const valorAnterior = select.value;
            const statuses = [...new Set(
                todasAsClaims
                    .map(item => item.statusGeral.trim())
                    .filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, 'pt-BR'));

            select.innerHTML = '<option value="todos">Todos os status</option>';
            statuses.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.toLowerCase();
                opt.textContent = st;
                select.appendChild(opt);
            });

            if ([...select.options].some(o => o.value === valorAnterior)) {
                select.value = valorAnterior;
            }
        }

        function atualizarResumo(filtradas) {
            const totalCegs = filtradas.length;
            const quitadas = filtradas.filter(item => item.statusPag.toLowerCase().includes('pago')).length;

            let totalAPagar = 0;
            filtradas.forEach(item => {
                const isPago = item.statusPag.toLowerCase().includes('pago');
                if (!isPago) {
                    const restante = parseCurrency(item.valorRestante);
                    const total = parseCurrency(item.valorTotal);
                    totalAPagar += restante > 0 ? restante : total;
                }
            });

            document.getElementById('sum-total').innerText = totalCegs;
            document.getElementById('sum-paid').innerText = quitadas;
            document.getElementById('sum-pending').innerText = formatBRL(totalAPagar);
        }

        async function iniciarSite() {
            const msg = document.getElementById('status-message');
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Falha na rede');
                const csvText = await response.text();
                const linhas = parseCSV(csvText);

                todasAsClaims = linhas.slice(1).map(col => ({
                    ceg: col[0] || '',
                    tipo: col[1] || '',
                    gom: col[2] || '',
                    itens: col[3] || '',
                    integrantes: col[4] || '',
                    valorTotal: col[5] || '',
                    statusPag: col[6] || '',
                    valorRestante: col[7] || '',
                    prazo1: col[8] || '',
                    prazo2: col[9] || '',
                    statusGeral: col[10] || '',
                    at: col[12] || ''
                })).filter(item => item.ceg !== '');

                popularStatusGeralSelect();
                renderizarClaims();
            } catch (erro) {
                console.error(erro);
                msg.innerText = 'ops! não consegui ler a planilha. confira se ela está pública como Leitor 🥺';
            }
        }

        function setFiltro(tipo, botao) {
            filtroAtual = tipo;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            botao.classList.add('active');
            renderizarClaims();
        }

        function filtrarClaims() {
            renderizarClaims();
        }

        function renderizarClaims() {
            const container = document.getElementById('results-container');
            const msg = document.getElementById('status-message');
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusGeralFiltro = document.getElementById('statusGeralSelect').value;

            container.innerHTML = '';

            const filtradas = todasAsClaims.filter(item => {
                const isPago = item.statusPag.toLowerCase().includes('pago');
                if (filtroAtual === 'pago' && !isPago) return false;
                if (filtroAtual === 'pendente' && isPago) return false;

                if (statusGeralFiltro !== 'todos') {
                    if (item.statusGeral.toLowerCase().trim() !== statusGeralFiltro) return false;
                }

                if (termo) {
                    const textoCompleto = `${item.ceg} ${item.gom} ${item.itens} ${item.integrantes} ${item.at} ${item.statusGeral}`.toLowerCase();
                    return textoCompleto.includes(termo);
                }
                return true;
            });

            atualizarResumo(filtradas);

            if (filtradas.length === 0) {
                msg.style.display = 'block';
                msg.innerText = 'nenhuma claim encontrada para este filtro... (｡•́︿•̀｡)';
                return;
            }

            msg.style.display = 'none';

            filtradas.forEach((item, index) => {
                const isPago = item.statusPag.toLowerCase().includes('pago');
                const card = document.createElement('div');
                card.className = 'claim-card';
                card.style.animationDelay = `${index * 0.06}s`;

                const prazo1Texto = item.prazo1 ? `1º prazo: ${item.prazo1}` : '1º prazo: -';
                const prazo2Texto = item.prazo2 ? `2º prazo: ${item.prazo2}` : '2º prazo: -';

                card.innerHTML = `
                    <div class="card-top-bar">
                        <span class="ceg-name">✦ ${item.ceg}</span>
                        ${item.tipo ? `<span class="type-tag">${item.tipo}</span>` : ''}
                    </div>
                    <div class="card-info">
                        <p><strong>gom/comu:</strong> ${item.gom || '-'}</p>
                        <p><strong>itens:</strong> ${item.itens || '-'}</p>
                        ${item.integrantes ? `<div class="members-box">${item.integrantes}</div>` : ''}
                        ${item.at ? `<p><strong>user:</strong> ${item.at}</p>` : ''}

                        <div class="meta-badges">
                            ${item.statusGeral ? `<span class="status-geral-tag">📦 Status Geral: ${item.statusGeral}</span>` : ''}
                        </div>

                        <div class="deadlines-box">
                            <span>🗓️ ${prazo1Texto}</span>
                            <span>🗓️ ${prazo2Texto}</span>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <span class="badge-pay ${isPago ? 'paid' : 'pending'}">
                            ${item.statusPag || 'Pendente'} ${item.valorRestante ? `(falta: ${item.valorRestante})` : ''}
                        </span>
                        <span class="price-tag">${item.valorTotal || ''}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = iniciarSite;
    </script>
</body>
</html>
